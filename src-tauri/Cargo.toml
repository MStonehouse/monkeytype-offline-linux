[package]
name = "monkeytype-offline"
version = "1.0.2"
description = "Monkeytype Offline desktop wrapper"
authors = ["Mike Stonehouse"]
license = "GPL-3.0"
edition = "2021"

[lib]
name = "monkeytype_offline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
